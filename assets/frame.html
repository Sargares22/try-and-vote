<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap">
<style>
  /* The frame of a feature-verdicts page: the same for every product. `demo.mjs` puts it around
     the product file; do not edit it per page. Layout: a top bar with the tabs and the counter;
     then the brief and the verdict in a side column and the product mock on a stage beside
     them. In a narrow container it is one column and the verdict sticks to the bottom edge.
     Written by the rules of the good-css skill: one set of oklch tokens for both themes,
     logical properties, a container query, hover only where hover exists. */
  :root{
    color-scheme:dark;
    --fd-page:light-dark(oklch(96.4% 0 none),oklch(19.2% 0.008 274));
    --fd-stage:light-dark(oklch(92.7% 0.005 107),oklch(15.9% 0.007 271));
    --fd-panel:light-dark(oklch(100.0% 0 none),oklch(22.3% 0.010 277));
    --fd-field:light-dark(oklch(100.0% 0 none),oklch(29.7% 0 none));
    --fd-ink:light-dark(oklch(21.3% 0.004 264),oklch(100.0% 0 none));
    --fd-dim:light-dark(oklch(50.6% 0.010 264),oklch(65.0% 0.017 270));
    --fd-accent:light-dark(oklch(53.0% 0.200 265),oklch(76.9% 0.117 262));
    --fd-on:light-dark(oklch(100.0% 0 none),oklch(16.9% 0.006 271));
    --fd-yes:light-dark(oklch(51.0% 0.115 157),oklch(80.2% 0.112 156));
    --fd-no:light-dark(oklch(54.3% 0.174 30),oklch(75.0% 0.120 31));
    --fd-warn:light-dark(oklch(50.8% 0.108 73),oklch(82.7% 0.115 88));
    --fd-line:color-mix(in oklch,var(--fd-ink) 13%,transparent);
    --fd-dot:color-mix(in oklch,var(--fd-ink) 9%,transparent);
    --fd-yes-soft:color-mix(in oklch,var(--fd-yes) 16%,var(--fd-page));
    --fd-no-soft:color-mix(in oklch,var(--fd-no) 16%,var(--fd-page));
    --fd-warn-soft:color-mix(in oklch,var(--fd-warn) 16%,var(--fd-page));
    --fd-font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --fd-gutter:clamp(1rem,.6rem + 1.2vw,1.25rem);
    --fd-title:clamp(1.375rem,1.2rem + .6vw,1.625rem);
    --fd-r:.75rem;
  }
  /* The theme is a colour scheme, never a second set of tokens */
  :root[data-fd="light"]{color-scheme:light}
  :root[data-fd="auto"]{color-scheme:light dark}
  :root[data-fd="auto"][data-theme="light"]{color-scheme:light}
  :root[data-fd="auto"][data-theme="dark"]{color-scheme:dark}
  :root[data-fd-font="onest"]{--fd-font:"Onest","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif}
  :root[data-fd-font="geist"]{--fd-font:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif}

  *{box-sizing:border-box}
  html,body{min-block-size:100%}
  body{margin:0;background:var(--fd-page);color:var(--fd-ink);font:.9375rem/1.45 var(--fd-font);-webkit-tap-highlight-color:transparent}
  /* Zero specificity, so nothing here outranks the product's own rules inside the stage */
  :where(.fd button,.fd textarea){font:inherit;color:inherit}
  :where(.fd button){cursor:pointer}
  :where(.fd :is(button,textarea)):focus-visible{outline:max(2px,.08em) solid var(--fd-accent);outline-offset:2px}
  :where(.fd-tab,.fd-vb,.fd-seg button,.fd-reset,.fd-btn,.fd-done,.fd-link,.fd-next):active{transform:scale(.97)}
  @media (prefers-reduced-motion:no-preference){
    :where(.fd-tab,.fd-vb,.fd-seg button,.fd-reset,.fd-btn,.fd-done,.fd-link,.fd-next){transition:transform 160ms ease-out}
  }

  .fd{container-type:inline-size;display:flex;flex-direction:column;gap:.875rem;padding-inline:var(--fd-gutter);padding-block:.875rem 1.25rem;max-inline-size:90rem;margin-inline:auto}
  .fd-top{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem 1.125rem;min-inline-size:0}
  .fd-brand{flex:none;display:flex;align-items:baseline;gap:.5rem}
  .fd-brand b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
  .fd-brand small{font-size:.8125rem;color:var(--fd-dim)}
  .fd-tabs{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:none;min-inline-size:0;flex:1 1 0;padding:2px}
  .fd-tab{position:relative;flex:none;display:flex;align-items:center;gap:.5rem;border:0;background:none;block-size:2.5rem;padding-inline:.6875rem .875rem;border-radius:999px;
    color:var(--fd-dim);white-space:nowrap;font-size:.875rem;font-weight:500;box-shadow:inset 0 0 0 1px var(--fd-line)}
  .fd-tab[aria-selected=true]{background:var(--fd-ink);color:var(--fd-page);box-shadow:none;font-weight:600}
  @media (hover:hover) and (pointer:fine){
    .fd-tab:hover,.fd-reset:hover,.fd-link:hover{color:var(--fd-ink)}
    .fd-tab[aria-selected=true]:hover{color:var(--fd-page)}
  }
  /* The mark of a tab: an empty ring until decided, then a filled disc with the answer */
  .fd-vm{flex:none;inline-size:1.125rem;block-size:1.125rem;border-radius:50%;display:grid;place-items:center;font-size:.6875rem;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.55}
  .fd-vm:is(.yes,.no,.later,.note){opacity:1;box-shadow:none;color:var(--fd-on)}
  .fd-vm.yes{background:var(--fd-yes)} .fd-vm.no{background:var(--fd-no)} .fd-vm.later{background:var(--fd-warn)} .fd-vm.note{background:var(--fd-accent)}
  .fd-upd{font-size:.625rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fd-on);background:var(--fd-accent);padding:2px 7px;border-radius:999px}
  .fd-count{flex:none;margin-inline-start:auto;font-size:.8125rem;color:var(--fd-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .fd-count b{font-size:1rem;font-weight:700;color:var(--fd-ink)}

  .fd-body{display:grid;grid-template-columns:minmax(18.75rem,23.75rem) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:1.125rem 1.5rem;
    grid-template-areas:"brief stage" "verdict stage" "foot stage"}
  .fd-brief{grid-area:brief;min-inline-size:0;padding-block-start:.375rem}
  .fd-meta{display:flex;gap:.375rem;flex-wrap:wrap;align-items:center;margin-block-end:.625rem}
  .fd-lvl{font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .fd-lvl.l0{color:var(--fd-yes);background:var(--fd-yes-soft)} .fd-lvl.l1{color:var(--fd-warn);background:var(--fd-warn-soft)} .fd-lvl.l2{color:var(--fd-no);background:var(--fd-no-soft)}
  .fd-brief h1{margin:0;font-size:var(--fd-title);line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
  .fd-brief p{margin-block:.625rem 0;margin-inline:0;overflow-wrap:anywhere}
  .fd-do,.fd-reply{padding:.75rem .875rem;border-radius:var(--fd-r);background:var(--fd-panel);box-shadow:inset 0 0 0 1px var(--fd-line)}
  .fd-do{font-weight:500}
  .fd-do b,.fd-reply b{display:block;font-size:.6875rem;letter-spacing:.05em;text-transform:uppercase;color:var(--fd-accent);font-weight:700;margin-block-end:2px}
  .fd-caveat{padding:.5625rem .875rem;border-radius:var(--fd-r);background:var(--fd-warn-soft);color:var(--fd-warn);font-size:.8125rem}
  .fd-who{font-size:.8125rem;color:var(--fd-dim)}

  .fd-stagewrap{grid-area:stage;min-inline-size:0;position:relative;display:flex;flex-direction:column;border-radius:1.25rem;
    background:radial-gradient(var(--fd-dot) 1px,transparent 1.5px) 0 0/18px 18px var(--fd-stage)}
  .fd-bar{display:flex;gap:.5rem;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:.75rem 0;padding-inline:.75rem 3.75rem;min-block-size:3.5rem}
  .fd-tools{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
  /* Nested corners: the outer radius is the inner one plus the padding */
  .fd-seg{--r:.5625rem;--pad:3px;display:flex;flex-wrap:wrap;background:var(--fd-panel);border-radius:calc(var(--r) + var(--pad));padding:var(--pad);box-shadow:inset 0 0 0 1px var(--fd-line)}
  .fd-seg button{position:relative;border:0;background:none;block-size:2.25rem;padding-inline:.875rem;border-radius:var(--r);font-size:.875rem;font-weight:500;color:var(--fd-dim)}
  .fd-seg button::after,.fd-link::after,.fd-next::after{content:"";position:absolute;inset:min(0px,(100% - 44px)/2)}
  .fd-seg button[aria-pressed=true]{background:var(--fd-ink);color:var(--fd-page);font-weight:600}
  .fd-reset{position:absolute;inset-inline-end:.75rem;inset-block-start:.75rem;inline-size:2.75rem;block-size:2.75rem;border-radius:50%;border:0;background:var(--fd-panel);color:var(--fd-dim);
    box-shadow:inset 0 0 0 1px var(--fd-line);display:grid;place-items:center;padding:0}
  .fd-reset svg{inline-size:1.1875rem;block-size:1.1875rem}
  .fd-stage{flex:1 1 auto;display:grid;place-items:safe center;min-block-size:26rem;padding:1rem;min-inline-size:0}

  .fd-verdict{grid-area:verdict;min-inline-size:0;display:flex;flex-direction:column;gap:.5rem}
  .fd-vbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
  .fd-vb{border:0;border-radius:.875rem;block-size:3.5rem;padding-inline:.375rem;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.5rem}
  .fd-vb svg{flex:none;inline-size:1.25em;block-size:1.25em}
  .fd-vb.yes{background:var(--fd-yes-soft);color:var(--fd-yes)} .fd-vb.later{background:var(--fd-warn-soft);color:var(--fd-warn)} .fd-vb.no{background:var(--fd-no-soft);color:var(--fd-no)}
  .fd-vb.yes[aria-pressed=true]{background:var(--fd-yes);color:var(--fd-on)}
  .fd-vb.later[aria-pressed=true]{background:var(--fd-warn);color:var(--fd-on)}
  .fd-vb.no[aria-pressed=true]{background:var(--fd-no);color:var(--fd-on)}
  .fd-verdict.decided .fd-vb[aria-pressed=false]{background:none;box-shadow:inset 0 0 0 1px var(--fd-line);color:var(--fd-dim)}
  :root[data-fd-buttons="calm"] .fd-vb{background:var(--fd-panel);color:var(--fd-ink);box-shadow:inset 0 0 0 1px var(--fd-line)}
  :root[data-fd-buttons="calm"] .fd-vb svg{display:none}
  /* Grows with what is typed: no script, no fixed height */
  .fd-verdict textarea,.fd-io textarea{display:block;inline-size:100%;field-sizing:content;min-block-size:calc(3lh + 1.375rem);max-block-size:calc(12lh + 1.375rem);resize:none;border-radius:var(--fd-r);border:0;
    background:var(--fd-field);box-shadow:inset 0 0 0 1px var(--fd-line);padding:.6875rem .875rem;line-height:1.4}
  .fd-reply{margin:0;font-size:.875rem}
  .fd-vline{display:flex;gap:.625rem;align-items:center;min-block-size:1.875rem;font-size:.8125rem;color:var(--fd-dim)}
  .fd-vline:has(.fd-vstate:empty):has(.fd-next[hidden]){display:none}
  .fd-vstate{flex:1 1 auto;min-inline-size:0}
  .fd-next{position:relative;flex:none;border:0;background:none;padding-block:.375rem;padding-inline:0;font-size:.875rem;font-weight:600;color:var(--fd-accent)}
  .fd-foot{grid-area:foot;display:flex;gap:.25rem 1rem;flex-wrap:wrap;align-content:flex-start;align-items:center;font-size:.8125rem}
  .fd-foot:not(:has(> :not([hidden]))){display:none}
  .fd-link{position:relative;border:0;background:none;padding-block:.375rem;padding-inline:0;color:var(--fd-dim);text-decoration:underline;text-underline-offset:3px}
  .fd-done{border:0;block-size:2.75rem;padding-inline:1.125rem;border-radius:var(--fd-r);background:var(--fd-accent);color:var(--fd-on);font-weight:600}
  .fd-io{display:flex;flex-direction:column;gap:.5rem;background:var(--fd-panel);border-radius:var(--fd-r);padding:.875rem;box-shadow:inset 0 0 0 1px var(--fd-line)}
  .fd-io textarea{font:.75rem/1.4 ui-monospace,Consolas,monospace}
  .fd-io div{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.8125rem;color:var(--fd-dim)}
  .fd-btn{border:0;background:var(--fd-page);box-shadow:inset 0 0 0 1px var(--fd-line);block-size:2.75rem;padding-inline:.875rem;border-radius:.625rem}

  /* One column when the page's own container is narrow: a phone, a split view, a side pane */
  @container (inline-size < 54rem){
    .fd-tabs{order:3;flex:1 0 100%;margin-inline:calc(-1*var(--fd-gutter));padding-inline:var(--fd-gutter)}
    .fd-body{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"brief" "stage" "verdict" "foot";gap:.75rem}
    .fd-brief{padding-block-start:0}
    .fd-stagewrap{margin-inline:calc(-1*var(--fd-gutter));border-radius:0}
    .fd-stage{min-block-size:0;padding-block:.75rem 1.25rem}
    /* The verdict stays under the thumb while the mock is being tried */
    .fd-verdict{position:sticky;inset-block-end:0;z-index:20;margin-inline:calc(-1*var(--fd-gutter));padding-inline:var(--fd-gutter);
      padding-block:.625rem calc(.625rem + env(safe-area-inset-bottom,0px));background:var(--fd-page);box-shadow:0 -1px 0 var(--fd-line)}
    .fd-vb{block-size:3.25rem}
    .fd-verdict textarea{min-block-size:calc(1lh + 1.375rem);max-block-size:calc(5lh + 1.375rem)}
    .fd-foot{padding-block-end:1rem}
  }

  /* Layout "stack": the page reads top to bottom. Tabs, a compact note with the switches on its
     side, the mock, the verdict in one row. */
  :root[data-fd-layout="stack"] body{font-size:.875rem;line-height:1.4}
  :root[data-fd-layout="stack"] .fd{gap:.625rem;padding-block:.625rem 1rem}
  :root[data-fd-layout="stack"] .fd-tabs{gap:2px}
  :root[data-fd-layout="stack"] .fd-tab{block-size:auto;padding-block:.5rem .625rem;padding-inline:.625rem;border-radius:.375rem;box-shadow:none;font-size:.8125rem;gap:.3125rem;flex-direction:row-reverse;background:none}
  :root[data-fd-layout="stack"] .fd-tab[aria-selected=true]{color:var(--fd-ink)}
  :root[data-fd-layout="stack"] .fd-tab[aria-selected=true]::after{content:"";position:absolute;inset-inline-start:calc(50% - 9px);inset-block-end:3px;inline-size:18px;block-size:3px;border-radius:2px;background:var(--fd-accent)}
  :root[data-fd-layout="stack"] .fd-vm{inline-size:auto;block-size:auto;font-size:.8125rem;box-shadow:none;background:none;opacity:1}
  :root[data-fd-layout="stack"] .fd-vm:empty{display:none}
  :root[data-fd-layout="stack"] .fd-vm.yes{color:var(--fd-yes)} :root[data-fd-layout="stack"] .fd-vm.no{color:var(--fd-no)} :root[data-fd-layout="stack"] .fd-vm.later{color:var(--fd-warn)} :root[data-fd-layout="stack"] .fd-vm.note{color:var(--fd-accent)}
  :root[data-fd-layout="stack"] .fd-body{display:flex;flex-direction:column;gap:.625rem}
  :root[data-fd-layout="stack"] .fd-brief{display:flex;gap:.625rem 1.25rem;align-items:center;flex-wrap:wrap;background:var(--fd-panel);border-radius:.625rem;padding:.625rem .875rem;box-shadow:inset 0 0 0 1px var(--fd-line)}
  :root[data-fd-layout="stack"] .fd-brief-text{flex:1 1 18.75rem;min-inline-size:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 .5rem}
  :root[data-fd-layout="stack"] .fd-meta{order:1;margin:0}
  :root[data-fd-layout="stack"] .fd-brief h1{font-size:.9375rem;font-weight:600;letter-spacing:0;line-height:1.3}
  :root[data-fd-layout="stack"] .fd-brief p{flex:1 0 100%;margin-block:3px 0;font-size:.8125rem}
  :root[data-fd-layout="stack"] .fd-desc{order:2;color:var(--fd-dim)}
  :root[data-fd-layout="stack"] .fd-who{order:3;font-size:.75rem}
  :root[data-fd-layout="stack"] .fd-caveat{order:4;padding:0;background:none}
  :root[data-fd-layout="stack"] .fd-do{order:5;padding:0;background:none;box-shadow:none;border-radius:0;display:flex;gap:.4375rem;align-items:baseline;margin-block-start:5px;font-weight:400}
  :root[data-fd-layout="stack"] .fd-do b{display:inline;margin:0;flex:none}
  :root[data-fd-layout="stack"] .fd-seg{--r:.3125rem;--pad:2px;background:var(--fd-page)}
  :root[data-fd-layout="stack"] .fd-seg button{block-size:auto;padding-block:.375rem;padding-inline:.6875rem;font-size:.8125rem}
  :root[data-fd-layout="stack"] .fd-seg button[aria-pressed=true]{background:var(--fd-line);color:var(--fd-ink)}
  :root[data-fd-layout="stack"] .fd-stagewrap{background:none;border-radius:0;margin:0}
  :root[data-fd-layout="stack"] .fd-bar{display:none}
  :root[data-fd-layout="stack"] .fd-reset{inset-inline-end:0;inset-block-start:0}
  :root[data-fd-layout="stack"] .fd-stage{min-block-size:0;padding-block:.25rem;padding-inline:0}
  :root[data-fd-layout="stack"] .fd-verdict{position:static;margin:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:.625rem .875rem;background:var(--fd-panel);border-radius:.625rem;padding:.75rem .875rem;box-shadow:inset 0 0 0 1px var(--fd-line)}
  :root[data-fd-layout="stack"] .fd-vbtns{display:flex;flex:none}
  :root[data-fd-layout="stack"] .fd-vb{block-size:2.875rem;padding-inline:1.25rem;min-inline-size:6.5rem;font-size:.9375rem;font-weight:600;border-radius:.5rem}
  :root[data-fd-layout="stack"] .fd-verdict textarea{flex:1 1 16.25rem;inline-size:auto;min-block-size:2.875rem;border-radius:.375rem}
  :root[data-fd-layout="stack"] .fd-vline,:root[data-fd-layout="stack"] .fd-reply{flex:1 0 100%}
  @container (inline-size < 54rem){:root[data-fd-layout="stack"][data-fd-skin] .fd-stage{padding-block-start:3.25rem}}

  /* Skin "graphite": neutral black and white, hairlines, one strong colour, state shown by small
     coloured dots. Drawn from pages looked at on 11.10.2026: the preview toolbar of
     ui.shadcn.com/blocks, the option groups of the Radix Themes playground, the text tabs and
     dot markers of linear.app, the filter pills of refero.design. */
  :root[data-fd-skin="graphite"]{
    --fd-page:light-dark(oklch(100.0% 0 none),oklch(14.5% 0 none));
    --fd-stage:light-dark(oklch(98.5% 0 none),oklch(14.5% 0 none));
    --fd-panel:light-dark(oklch(98.5% 0 none),oklch(20.5% 0 none));
    --fd-field:light-dark(oklch(100.0% 0 none),oklch(14.5% 0 none));
    --fd-ink:light-dark(oklch(14.5% 0 none),oklch(98.5% 0 none));
    --fd-dim:light-dark(oklch(55.6% 0 none),oklch(70.9% 0 none));
    --fd-accent:light-dark(oklch(14.5% 0 none),oklch(98.5% 0 none));
    --fd-on:light-dark(oklch(100.0% 0 none),oklch(14.5% 0 none));
    --fd-yes:light-dark(oklch(52.7% 0.137 150),oklch(80.0% 0.182 152));
    --fd-no:light-dark(oklch(50.5% 0.190 28),oklch(71.1% 0.166 22));
    --fd-warn:light-dark(oklch(55.4% 0.121 66),oklch(86.1% 0.173 92));
    --fd-dot:transparent}
  :root[data-fd-skin="graphite"] .fd-brand b,:root[data-fd-skin="graphite"] .fd-brief h1{font-weight:600}
  :root[data-fd-skin="graphite"] .fd-tab{block-size:auto;padding-block:.4375rem;padding-inline:.625rem;border-radius:.5rem;box-shadow:none;background:none;flex-direction:row;gap:.4375rem;font-size:.875rem;font-weight:500;color:var(--fd-dim)}
  :root[data-fd-skin="graphite"] .fd-tab[aria-selected=true]{background:none;color:var(--fd-ink);font-weight:500}
  :root[data-fd-skin="graphite"] .fd-tab[aria-selected=true]::after{content:none}
  :root[data-fd-skin="graphite"] .fd-vm,:root[data-fd-skin="graphite"] .fd-vm:empty{display:block;flex:none;inline-size:7px;block-size:7px;font-size:0;box-shadow:none;opacity:1;background:var(--fd-line)}
  :root[data-fd-skin="graphite"] .fd-vm.yes{background:var(--fd-yes)} :root[data-fd-skin="graphite"] .fd-vm.no{background:var(--fd-no)} :root[data-fd-skin="graphite"] .fd-vm.later{background:var(--fd-warn)} :root[data-fd-skin="graphite"] .fd-vm.note{background:var(--fd-dim)}
  :root[data-fd-skin="graphite"] .fd-upd{border-radius:5px}
  :root[data-fd-skin="graphite"] .fd-lvl{background:none;box-shadow:inset 0 0 0 1px var(--fd-line);border-radius:6px}
  :root[data-fd-skin="graphite"] .fd-do b{color:var(--fd-dim)}
  :root[data-fd-skin="graphite"] .fd-caveat{background:none;box-shadow:inset 0 0 0 1px var(--fd-line)}
  :root[data-fd-skin="graphite"][data-fd-layout="stack"] .fd-caveat{box-shadow:none}
  :root[data-fd-skin="graphite"] .fd-stagewrap{background:var(--fd-stage);border-radius:.875rem;box-shadow:inset 0 0 0 1px var(--fd-line)}
  :root[data-fd-skin="graphite"][data-fd-layout="stack"] .fd-stage{padding:.875rem}
  :root[data-fd-skin="graphite"][data-fd-layout="stack"] .fd-reset{inset-inline-end:.625rem;inset-block-start:.625rem}
  :root[data-fd-skin="graphite"] .fd-bar{justify-content:flex-start}
  :root[data-fd-skin="graphite"] .fd-seg{--r:.375rem;--pad:3px;background:var(--fd-panel)}
  :root[data-fd-skin="graphite"] .fd-seg button{block-size:2rem;padding-inline:.75rem;font-size:.8125rem;font-weight:500}
  :root[data-fd-skin="graphite"] .fd-seg button[aria-pressed=true]{background:color-mix(in oklch,var(--fd-ink) 14%,var(--fd-panel));color:var(--fd-ink);font-weight:500}

  :root[data-fd-skin="graphite"] .fd-vb.yes svg{color:var(--fd-yes)} :root[data-fd-skin="graphite"] .fd-vb.later svg{color:var(--fd-warn)} :root[data-fd-skin="graphite"] .fd-vb.no svg{color:var(--fd-no)}
  :root[data-fd-skin="graphite"] .fd-vb[aria-pressed=true]{background:var(--fd-ink);color:var(--fd-on);box-shadow:none;font-weight:600}
  :root[data-fd-skin="graphite"][data-fd-buttons="color"] .fd-vb.yes[aria-pressed=true]{background:var(--fd-yes)} :root[data-fd-skin="graphite"][data-fd-buttons="color"] .fd-vb.later[aria-pressed=true]{background:var(--fd-warn)} :root[data-fd-skin="graphite"][data-fd-buttons="color"] .fd-vb.no[aria-pressed=true]{background:var(--fd-no)}
  :root[data-fd-skin="graphite"][data-fd-buttons="color"] .fd-vb[aria-pressed=true] svg{color:inherit}

<div class="fd">
  <header class="fd-top">
    <div class="fd-brand"><b id="fd-brand"></b><small id="fd-sub"></small></div>
    <nav class="fd-tabs" id="fd-tabs" role="tablist"></nav>
    <div class="fd-count" id="fd-sum"></div>
  </header>
  <div class="fd-body">
    <section class="fd-brief" id="fd-brief"><div class="fd-brief-text">
      <div class="fd-meta"><span class="fd-lvl" id="fd-lvl"></span><span class="fd-upd" id="fd-updtag" hidden></span></div>
      <h1 id="fd-title"></h1>
      <p class="fd-desc" id="fd-desc"></p>
      <p class="fd-do"><b id="fd-do-label"></b><span id="fd-do"></span></p>
      <p class="fd-caveat" id="fd-caveat" hidden></p>

    </div></section>
    <main class="fd-stagewrap">
      <div class="fd-bar" id="fd-bar"><div class="fd-tools" id="fd-tools"></div></div>
        <button class="fd-reset" id="fd-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5V9h4.5"/></svg></button>
      <div class="fd-stage" id="fd-stage"></div>
    </main>
    <section class="fd-verdict" id="fd-verdict">
      <div class="fd-vbtns">
        <button class="fd-vb yes" id="fd-yes" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span></span></button>
        <button class="fd-vb later" id="fd-later" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span></span></button>
        <button class="fd-vb no" id="fd-no" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><span></span></button>
      </div>

      <p class="fd-reply" id="fd-reply" hidden><b id="fd-reply-label"></b><span id="fd-reply-text"></span></p>
      <div class="fd-vline"><span class="fd-vstate" id="fd-vstate"></span><button class="fd-next" id="fd-next" hidden></button></div>

    <div><button class="fd-btn" id="fd-io-load"></button><button class="fd-btn" id="fd-io-close"></button><span id="fd-io-state"></span></div>
  </section>

<script>
(() => {
  const DEMO = window.DEMO || {}, TABS = [...(DEMO.tabs || [])];
  const TEXTS = {
    ru:{levels:['не усложняет','усложняет немного','усложняет заметно'],
      updated:'обновлено', doLabel:'Что нажать', caveat:'Не проверено: ', reset:'Начать сначала',
      yes:'Беру', later:'Позже', no:'Не беру', comment:'Комментарий. Можно надиктовать', next:'Дальше →',
      reply:'Ответ агента', done:'Готово, отправить агенту', sent:'Отправлено агенту. Страницу можно закрыть', notSent:'Не отправилось: агент не слушает. Нажмите «Скопировать ответы»',
      sum:(done, all) => `<b>${done}</b> из ${all} решено`,
      saving:'Сохраняю…', failed:'Не сохранилось. Ответ остался в этом браузере',
      saved:{claude:'Сохранено. Агент это увидит', file:'Сохранено в файл рядом со страницей', local:'Сохранено только в этом браузере. Чтобы передать, нажмите «Скопировать ответы»'},
      copy:'Скопировать ответы', copied:'Ответы скопированы. Вставьте их в чат', copyManual:'Выделено. Скопируйте вручную',
      importBtn:'Вставить ответы', load:'Загрузить', close:'Закрыть', loaded:n => `Загружено ответов: ${n}`, badJson:'Это не ответы с такой страницы'},
    en:{levels:['adds no complexity','adds a little complexity','adds real complexity'],
      updated:'updated', doLabel:'What to press', caveat:'Not verified: ', reset:'Start over',
      yes:'Take', later:'Later', no:'Skip', comment:'Comment. Dictation works', next:'Next →',
      reply:'The agent\'s answer', done:'Done, send to the agent', sent:'Sent to the agent. You can close the page', notSent:'Not sent: the agent is not listening. Press "Copy answers"',
      sum:(done, all) => `<b>${done}</b> of ${all} decided`,
      saving:'Saving…', failed:'Not saved. The answer is kept in this browser',
      saved:{claude:'Saved. The agent will see it', file:'Saved to the file beside the page', local:'Saved in this browser only. Press "Copy answers" to hand them over'},
      copy:'Copy answers', copied:'Answers copied. Paste them into the chat', copyManual:'Selected. Copy it by hand',
      importBtn:'Paste answers', load:'Load', close:'Close', loaded:n => `Answers loaded: ${n}`, badJson:'These are not answers from this page'},
  };
  const T = {...(TEXTS[DEMO.lang] || TEXTS.ru), ...(DEMO.text || {})};

  const $ = id => document.getElementById(id);
  TABS.sort((a, b) => !!b.upd - !!a.upd);
  const root = document.documentElement;
  // The look the owner chose on 11.10.2026 is the default: two columns, dark, coloured verdict buttons, system font
  root.dataset.fd = ['light', 'auto'].includes(DEMO.theme) ? DEMO.theme : 'dark';
  root.dataset.fdLayout = DEMO.layout === 'stack' ? 'stack' : 'split';
  root.dataset.fdButtons = DEMO.buttons === 'calm' ? 'calm' : 'color';
  root.dataset.fdFont = ['onest', 'geist'].includes(DEMO.font) ? DEMO.font : 'system';
  root.dataset.fdSkin = DEMO.skin === 'graphite' ? 'graphite' : 'soft';
  // The switches sit over the mock in the split layout and beside the note in the stacked one
  const place = () => (root.dataset.fdLayout === 'stack' ? $('fd-brief') : $('fd-bar')).append($('fd-tools'));
  if (DEMO.accent) document.documentElement.style.setProperty('--fd-accent', DEMO.accent);
  const stage = $('fd-stage'), tools = $('fd-tools'), tabsEl = $('fd-tabs');
  place();
  const lsGet = k => { try { return localStorage.getItem(DEMO.key + k); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(DEMO.key + k, v); } catch (_) {} };
  let cur = 0, vals = {};
  const tab = () => TABS[cur];

  $('fd-brand').textContent = DEMO.brand || ''; $('fd-sub').textContent = DEMO.sub || '';
  $('fd-do-label').textContent = T.doLabel; $('fd-updtag').textContent = T.updated;
  $('fd-yes').lastChild.textContent = T.yes; $('fd-later').lastChild.textContent = T.later; $('fd-no').lastChild.textContent = T.no;
  $('fd-reply-label').textContent = T.reply; $('fd-done').textContent = T.done;
  $('fd-comment').placeholder = T.comment; $('fd-comment').setAttribute('aria-label', T.comment);
  $('fd-reset').setAttribute('aria-label', T.reset); $('fd-reset').title = T.reset; $('fd-next').textContent = T.next;
  $('fd-copy').textContent = T.copy; $('fd-import').textContent = T.importBtn;
  $('fd-io-load').textContent = T.load; $('fd-io-close').textContent = T.close;

  // ---------- tabs, brief, switches ----------
  tabsEl.innerHTML = TABS.map((t, i) => `<button class="fd-tab" role="tab" data-tab="${i}" aria-selected="false"><span class="fd-vm"></span>${t.tab}${t.upd ? `<span class="fd-upd">${T.updated}</span>` : ''}</button>`).join('');
  tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(Number(b.dataset.tab)); });
  function mount(){ stage.replaceChildren(); tab().mount(stage, {...vals}); }
  function drawTools(){
    tools.innerHTML = (tab().controls || []).map(c => `<div class="fd-seg" role="group">${c.options.map(([v, label]) =>
      `<button data-c="${c.id}" data-v="${v}" aria-pressed="${vals[c.id] === v}">${label}</button>`).join('')}</div>`).join('');
  }
  tools.addEventListener('click', e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    vals[b.dataset.c] = b.dataset.v; drawTools(); mount();
  });
  $('fd-reset').addEventListener('click', mount);
  function go(i){
    if (typeTimer) flushText(tab().id);
    cur = i;
    const t = tab();
    tabsEl.querySelectorAll('.fd-tab').forEach((b, j) => { b.setAttribute('aria-selected', j === i); if (j === i) b.scrollIntoView({block:'nearest', inline:'nearest'}); });
    $('fd-title').textContent = t.title; $('fd-desc').textContent = t.desc; $('fd-who').textContent = t.who || ''; $('fd-do').textContent = t.do;
    $('fd-who').hidden = !t.who;
    $('fd-lvl').textContent = T.levels[t.lvl] || ''; $('fd-lvl').className = 'fd-lvl l' + t.lvl; $('fd-lvl').hidden = !(t.lvl in T.levels);
    $('fd-updtag').hidden = !t.upd;
    $('fd-reply').hidden = !t.reply; $('fd-reply-text').textContent = t.reply || '';
    $('fd-caveat').hidden = !t.caveat; $('fd-caveat').textContent = t.caveat ? T.caveat + t.caveat : '';
    vals = Object.fromEntries((t.controls || []).map(c => [c.id, c.options[0][0]]));
    drawTools(); mount();
    $('fd-vstate').textContent = ''; $('fd-comment').value = ''; showVerdict(true);
    lsSet('-tab', t.id);
    if (location.hash !== '#' + t.id) try { history.replaceState(null, '', '#' + t.id); } catch (_) {}
  }

  // ---------- verdict stores ----------
  // A verdict is one document per tab: {verdict:'yes'|'later'|'no'|'', comment, title, at}.
  // A store is {name, load() -> {id: doc}, save(id, doc), watch?(cb)}. The browser copy is always
  // kept as well, so an answer is never lost when the outside store is away.
  const stores = [
    // Claude artifact with the `db` capability: the agent reads collection "verdicts"
    async () => {
      const db = window.claude?.use ? await window.claude.use('db') : null;
      if (!db) return null;
      return {name:'claude',
        load:async () => ({}),
        watch:cb => db.collection('verdicts').onSnapshot(s => cb(Object.fromEntries(s.docs.map(d => [d.id, d.data() || {}]))), () => {}),
        save:(id, doc) => db.doc('verdicts/' + id).set(doc)};
    },
    // `demo.mjs serve`: the server keeps verdicts.json beside the page, any agent reads it from disk
    async () => {
      if (!window.__demoServe) return null;
      const call = (path, init) => fetch('__verdicts' + path, init).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      return {name:'file', load:() => call(''), save:(id, doc) => call('/' + id, {method:'PUT', body:JSON.stringify(doc)})};
    },
  ];
  const V = {}, dirty = new Set(), chains = {};
  let store = null, typeTimer = null;
  try { Object.assign(V, JSON.parse(lsGet('') || '{}')); } catch (_) {}
  const vYes = $('fd-yes'), vLater = $('fd-later'), vNo = $('fd-no'), vText = $('fd-comment'), vState = $('fd-vstate');
  const clean = x => ({verdict:['yes', 'later', 'no'].includes(x.verdict) ? x.verdict : '', comment:String(x.comment || ''), at:String(x.at || '')});
  const undecided = () => { for (let k = 1; k <= TABS.length; k++) { const i = (cur + k) % TABS.length; if (!V[TABS[i].id]?.verdict) return i; } return -1; };

  function showVerdict(fillText){
    const v = V[tab().id] || {};
    vYes.setAttribute('aria-pressed', v.verdict === 'yes');
    vLater.setAttribute('aria-pressed', v.verdict === 'later');
    vNo.setAttribute('aria-pressed', v.verdict === 'no');
    $('fd-verdict').classList.toggle('decided', !!v.verdict);
    if (fillText && document.activeElement !== vText) vText.value = v.comment || '';
    TABS.forEach((t, i) => {
      const x = V[t.id] || {}, m = tabsEl.children[i].querySelector('.fd-vm');
      m.className = 'fd-vm ' + (x.verdict || (x.comment ? 'note' : '')); m.textContent = {yes:'✓', later:'»', no:'✕'}[x.verdict] || (x.comment ? '…' : '');
    });
    $('fd-sum').innerHTML = T.sum(TABS.filter(t => V[t.id]?.verdict).length, TABS.length);
    const next = undecided();
    $('fd-next').hidden = !v.verdict || next < 0 || next === cur;
  }
  $('fd-next').addEventListener('click', () => { const i = undecided(); if (i >= 0) go(i); });
  const docOf = id => ({verdict:V[id]?.verdict || '', comment:V[id]?.comment || '', title:TABS.find(t => t.id === id)?.title || id, at:V[id]?.at || ''});
  function save(id, quiet){
    V[id].at = new Date().toISOString();
    lsSet('', JSON.stringify(V));
    const tell = t => { if (!quiet && tab().id === id) vState.textContent = t; };
    if (!store) { dirty.delete(id); return tell(T.saved.local); }
    tell(T.saving);
    const doc = docOf(id);
    chains[id] = (chains[id] || Promise.resolve()).then(() => store.save(id, doc)).then(
      () => { dirty.delete(id); tell(T.saved[store.name]); }, () => tell(T.failed));
  }
  // What came from outside wins, unless this browser holds a newer answer: that one is sent out
  function merge(remote){
    for (const [id, x] of Object.entries(remote)) {
      if (dirty.has(id)) continue;
      const r = clean(x);
      if (!V[id] || r.at >= (V[id].at || '')) V[id] = r;
    }
    lsSet('', JSON.stringify(V));
    for (const id of Object.keys(V)) {
      const r = remote[id], mine = V[id];
      if (store && (mine.verdict || mine.comment) && (!r || (mine.at || '') > String(r.at || ''))) {
        const doc = docOf(id);
        chains[id] = (chains[id] || Promise.resolve()).then(() => store.save(id, doc)).catch(() => {});
      }
    }
    showVerdict(true);
  }
  function vote(v){
    const id = tab().id, x = V[id] = V[id] || {};
    x.verdict = x.verdict === v ? '' : v;
    x.comment = vText.value.trim();
    dirty.add(id); showVerdict(false); save(id);
  }
  vYes.addEventListener('click', () => vote('yes'));
  vLater.addEventListener('click', () => vote('later'));
  vNo.addEventListener('click', () => vote('no'));
  // Outside Claude the agent waits for this press: the local server hands it the answers and stops
  $('fd-done').addEventListener('click', async () => {
    if (typeTimer) flushText(tab().id);
    await Promise.all(Object.values(chains));
    fetch('__done', {method:'POST'}).then(r => { vState.textContent = r.ok ? T.sent : T.notSent; }, () => { vState.textContent = T.notSent; });
  });
  function flushText(id){
    clearTimeout(typeTimer); typeTimer = null;
    const x = V[id] = V[id] || {}, text = vText.value.trim();
    if ((x.comment || '') === text) return;
    x.comment = text; showVerdict(false); save(id);
  }
  vText.addEventListener('input', () => {
    const id = tab().id; dirty.add(id); vState.textContent = '';
    clearTimeout(typeTimer); typeTimer = setTimeout(() => flushText(id), 900);
  });
  vText.addEventListener('blur', () => flushText(tab().id));

  // ---------- copy the answers out, paste them in: the way that works with no store at all ----------
  const io = $('fd-io'), ioText = $('fd-io-text'), ioState = $('fd-io-state');
  const exportJson = () => JSON.stringify(Object.fromEntries(TABS.filter(t => V[t.id] && (V[t.id].verdict || V[t.id].comment)).map(t => [t.id, docOf(t.id)])), null, 1);
  $('fd-copy').addEventListener('click', () => {
    if (typeTimer) flushText(tab().id);
    const text = exportJson();
    const manual = () => { io.hidden = false; $('fd-io-load').hidden = true; ioText.value = text; ioText.focus(); ioText.select(); ioState.textContent = T.copyManual; };
    if (!navigator.clipboard?.writeText) return manual();
    navigator.clipboard.writeText(text).then(() => { vState.textContent = T.copied; }, manual);
  });
  $('fd-import').addEventListener('click', () => { io.hidden = false; $('fd-io-load').hidden = false; ioText.value = ''; ioState.textContent = ''; ioText.focus(); });
  $('fd-io-close').addEventListener('click', () => { io.hidden = true; });
  $('fd-io-load').addEventListener('click', () => {
    let data = null;
    try { data = JSON.parse(ioText.value); } catch (_) {}
    const ids = data && typeof data === 'object' ? Object.keys(data).filter(id => TABS.some(t => t.id === id)) : [];
    if (!ids.length) { ioState.textContent = T.badJson; return; }
    for (const id of ids) { V[id] = clean(data[id]); dirty.add(id); save(id, true); }
    showVerdict(true); ioState.textContent = T.loaded(ids.length);
  });

  // For screenshots and checks
  window.demo = {
    tabs:TABS.map(t => ({id:t.id, tab:t.tab, title:t.title, desc:t.desc, who:t.who || '', do:t.do, lvl:t.lvl, caveat:t.caveat || '', reply:t.reply || '', upd:!!t.upd,
      code:String(t.mount), hasMount:typeof t.mount === 'function', controls:(t.controls || []).map(c => ({id:c.id, options:c.options.map(o => o[0])}))})),
    config:{key:DEMO.key, rev:DEMO.rev, brand:DEMO.brand},
    go:id => go(Math.max(0, TABS.findIndex(t => t.id === id))),
    set:(c, v) => { vals[c] = v; drawTools(); mount(); },
    look:o => { Object.assign(root.dataset, o); place(); },
  };
  if (!TABS.length) return;

  // A new revision opens on the first tab, which is the updated one. Otherwise the #anchor, then the last tab seen.
  let start = TABS.findIndex(t => '#' + t.id === location.hash);
  if (start < 0) start = TABS.findIndex(t => t.id === lsGet('-tab'));
  if (lsGet('-rev') !== String(DEMO.rev)) { start = 0; lsSet('-rev', String(DEMO.rev)); }
  go(start < 0 ? 0 : start);

  (async () => {
    for (const make of stores) {
      try { store = await make(); } catch (_) { store = null; }
      if (store) break;
    }
    if (!store) return;
    // The answers reach the agent by themselves: no copy and paste, and with the local server a "done" button
    $('fd-copy').hidden = $('fd-import').hidden = true; $('fd-done').hidden = store.name !== 'file';
    try { merge(await store.load()); } catch (_) {}
    if (store.watch) store.watch(merge);
  })();
})();
</script>
